<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log In - Crush</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      background: linear-gradient(135deg, #ff4b7d, #ff7a59);
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 25px;
    }

    h1 {
      text-align: center;
      color: #ff4b7d;
      margin-bottom: 8px;
    }

    p {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 15px;
      margin: 10px 0;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 15px;
      border: none;
      border-radius: 30px;
      background: #ff4b7d;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #ff4b7d;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Crush</h1>

    <p>Welcome back</p>

    <input type="email" placeholder="Email">

    <input type="password" placeholder="Password">

    <button>Log In</button>

    <a href="index.html" class="back">Back to Home</a>

  </div>

</body>
</html>
