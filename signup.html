<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Crush</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff4b7d, #ff7a59);
        }

        .box {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 30px;
            border-radius: 20px;
        }

        h1 {
            text-align: center;
            color: #ff4b7d;
        }

        input {
            width: 100%;
            padding: 14px;
            margin: 8px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 15px;
            margin-top: 15px;
            border: none;
            border-radius: 25px;
            background: #ff4b7d;
            color: white;
            font-size: 17px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="box">

        <h1>Create Account</h1>

        <input type="text" placeholder="Your name">

        <input type="email" placeholder="Email address">

        <input type="password" placeholder="Password">

        <button>Create Account</button>

    </div>

</body>
</html>
